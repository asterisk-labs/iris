{#
  Segmentation page: the React app in src/segmentation-app.tsx.
  Page data is passed as JSON and read by src/boot.ts.
#}

{% extends "base.html" %}
{% block title %}segmentation{% endblock %}
{% block head %}
    <link rel="stylesheet" href="{{ url_for('segmentation.static', filename='css/segmentation.css') }}">

    <script type="application/json" id="iris-page">{{ {
        'image_id': image_id,
        'image_location': image_location,
        'debug': debug_mode,
    }|tojson }}</script>

    <script type="module" src="{{ url_for('static', filename='dist/segmentationApp.js') }}"></script>
{% endblock %}
{% block content %}
    <div id="react-segmentation-app"></div>
{% endblock %}
