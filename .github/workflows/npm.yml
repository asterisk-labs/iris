name: Publish to npm

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Use an npm version that supports trusted publishing
        run: npm install --global npm@11

      - name: Check the release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node --input-type=module -e "import pkg from './package.json' with { type:'json' }; const expected = 'v' + pkg.version; if (process.env.RELEASE_TAG !== expected) throw new Error('Release ' + process.env.RELEASE_TAG + ' does not match package version ' + expected)"

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Publish
        run: npm publish --access public
