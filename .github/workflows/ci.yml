name: CI

on:
  push:
    branches:
      - master
      - overhaul
      - testci
  pull_request:
    branches:
      - master
      - overhaul
  schedule:
    - cron: "9 16 * * 1"

jobs:
  frontend:
    name: "frontend bundle"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Node.js dependencies
        env:
          CYPRESS_INSTALL_BINARY: 0
        run: npm ci

      - name: TypeScript type checking
        run: npx tsc --noEmit -p .

      - name: Frontend unit tests
        run: npm test

      - name: Rebuild the bundle
        run: npm run build

      # iris/static/dist is committed. A PR that changes the frontend source
      # must also commit the rebuilt bundle, otherwise what gets installed
      # does not match what was reviewed.
      - name: Check the committed bundle is up to date
        run: |
          # status (not just diff) so that a new or deleted chunk file also fails
          if [ -n "$(git status --porcelain -- iris/static/dist)" ]; then
            git status --porcelain -- iris/static/dist
            git diff -- iris/static/dist | head -n 100
            echo "::error::iris/static/dist is stale. Run 'npm run build' and commit the result."
            exit 1
          fi

  test:
    name: "${{ matrix.python-version }} • ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        exclude:
          # Reduce matrix size - only test edge cases on all platforms
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest  
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.11" 
          - os: windows-latest
            python-version: "3.12"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install UV
        uses: astral-sh/setup-uv@v10
        with:
          version: "latest"

      - name: Install OpenMP (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Verify UV installation
        run: uv --version
          
      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies and IRIS
        run: uv pip install -e ".[test]"

      - name: Verify installation
        run: uv run python environment_scripts/verify_installation.py

      - name: Test CLI functionality
        run: uv run iris --help

      - name: Test CLI from outside the repository
        shell: bash
        run: |
          # Importing iris and running the CLI must not depend on the cwd
          cd "${RUNNER_TEMP}"
          "${GITHUB_WORKSPACE}/.venv/bin/python" -c "import iris; from iris.cli import app; print('import ok')"
          "${GITHUB_WORKSPACE}/.venv/bin/iris" --help > /dev/null

      - name: Run pytest (Ubuntu only for coverage)
        if: matrix.os == 'ubuntu-latest'
        run: |
          uv pip install pytest pytest-cov codecov
          uv run python -m pytest -v --cov=iris --color=yes --cov-report=term-missing --cov-report=xml

      - name: Run pytest (other platforms)
        if: matrix.os != 'ubuntu-latest'
        run: |
          uv pip install pytest
          uv run python -m pytest -v

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.9'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}



      - name: Verify the committed frontend bundle is present
        shell: bash
        run: |
          # The bundle is committed in iris/static/dist; the frontend job checks it is current.
          ls -la iris/static/dist/
          test -f iris/static/dist/adminApp.js
          test -f iris/static/dist/segmentationApp.js

      - name: Set up Node.js (Ubuntu only, for Cypress)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.9'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Cypress dependencies (Ubuntu only)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.9'
        run: |
          npm ci
          # Install system dependencies for Cypress on Ubuntu
          # Install system dependencies for Cypress on Ubuntu
          sudo apt-get update
          sudo apt-get install -y libgtk2.0-0 libgtk-3-0 libgbm-dev libnotify-dev libnss3 libxss1 libxtst6 xauth xvfb

      - name: Run Cypress E2E tests (Ubuntu only)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.9'
        run: |
          # Start IRIS demo server with non-interactive admin creation
          echo "Starting IRIS server with admin credentials..."
          uv run iris demo --admin-user admin --admin-password 123 &
          SERVER_PID=$!
          echo "Started IRIS server with PID: $SERVER_PID"
          
          # Wait for server to be ready (max 60 seconds)
          echo "Waiting for server to start..."
          for i in {1..60}; do
            if curl -s http://localhost:5000 > /dev/null; then
              echo "✅ Server is ready!"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "❌ Server failed to start within 60 seconds"
              kill $SERVER_PID 2>/dev/null || true
              exit 1
            fi
            sleep 1
          done
          
          # Run Cypress tests in headless mode
          echo "Running Cypress E2E tests..."
          npm run cypress:headless || TEST_EXIT_CODE=$?
          
          # Stop the server
          echo "Stopping IRIS server..."
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          
          # Exit with test result
          exit ${TEST_EXIT_CODE:-0}
